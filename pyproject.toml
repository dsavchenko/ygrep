[project]
name = "ygrep"
version = "0.1.0"
description = "grep for YAML: match keys/values and report line numbers and YAML paths"
readme = "README.md"
authors = [
    { name = "Denys Savchenko", email = "denys.savchenko@cta-observatory.org" }
]
requires-python = ">=3.10"
dependencies = [
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
ygrep = "ygrep:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
